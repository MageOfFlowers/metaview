<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cẩm Nang Chiến Thuật - Thần Tích</title>
    <!-- Thư viện Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- CSS dùng chung của hệ thống -->
    <link rel="stylesheet" href="css/style.css">
    <!-- CSS riêng cho trang Guide -->
    <link rel="stylesheet" href="css/guide.css">
</head>
<body class="guide-body">
    <div class="container">
        <!-- Thanh điều hướng nhanh -->
        <header class="guide-header">
            <a href="index.html" class="back-link">
                <i class="fas fa-chevron-left"></i> Quay lại Portal
            </a>
            <h1>📊 Hệ Thống <span class="highlight">Cẩm Nang</span></h1>
        </header>

        <main class="guide-content">
    <!-- Section 1: How To Counter -->
<section class="guide-section">
    <!-- Header giữ nguyên hàm toggleSection -->
    <div class="section-header" onclick="toggleSection(this)">
        <div>
            <i class="fas fa-shield-halved"></i>
            <h2>How To Counter</h2>
        </div>
        <i class="fas fa-chevron-down"></i> <!-- Mũi tên của Section -->
    </div>
    
    <!-- Nội dung bên trong Section[cite: 5] -->
    <div class="section-content">
        <!-- Thanh tìm kiếm cho Counter -->
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="search-counter" placeholder="Tìm tên bộ bài...">
        </div>
        
        <div id="counter-list" class="counter-grid">
            <!-- JS render dữ liệu và các nút mũi tên slider ở đây[cite: 6] -->
        </div>
    </div>
</section>

<!-- Section 2: Build Deck -->
<section class="guide-section">
    <div class="section-header" onclick="toggleSection(this)">
        <div>
            <i class="fas fa-layer-group"></i>
            <h2>Build Deck</h2>
        </div>
        <i class="fas fa-chevron-down"></i>
    </div>
    
    <div class="section-content">
        <!-- Thanh tìm kiếm cho Build[cite: 7] -->
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="search-build" placeholder="Tìm bộ bài cộng đồng...">
        </div>
        
        <div id="fb-build-container" class="fb-preview-wrapper">
            <!-- JS render dữ liệu dạng list tối giản ở đây[cite: 6] -->
        </div>
    </div>
</section>
</main>

        <footer class="guide-footer">
            <p>© 2026 Thần Tích Portal</p>
        </footer>
    </div>

    <!-- Tích hợp Facebook SDK -->
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/vi_VN/sdk.js#xfbml=1&version=v18.0"></script>

    <!-- NẠP SCRIPT THEO THỨ TỰ -->
    <script src="js/guide.js"></script>
</body>
</html>
