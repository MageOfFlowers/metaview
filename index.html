<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Card Game Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome để dùng icon cho đẹp -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h3>Card Game Tool</h3>
            </div>
            <nav class="menu-list">
                <a href="/" class="menu-item">
                    <i class="fas fa-chart-line"></i> <span>Dashboard</span>
                </a>
                <a href="/meta-analysis" class="menu-item">
                    <i class="fas fa-search-dollar"></i> <span>Phân tích Meta</span>
                </a>
                <a href="/admin" class="menu-item">
                    <i class="fas fa-user-shield"></i> <span>Admin Panel</span>
                </a>
                
                <!-- Option mới thêm vào theo yêu cầu của bạn -->
                <a href="/guide" class="menu-item active">
                    <i class="fas fa-book-open"></i> <span>Guide & Counters</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header>
                <div class="user-info">
                    <span>Xin chào, <strong>Admin</strong></span>
                </div>
            </header>

            <div id="content-viewport">
                <!-- Nội dung các trang micro frontend sẽ được load vào đây 
                     hoặc chuyển hướng sang guide.html -->
                <h1>Chào mừng đến với hệ thống quản lý</h1>
                <p>Chọn một mục từ menu bên trái để bắt đầu.</p>
            </div>
        </main>

        <footer class="portal-footer">
            <p>© 2026 MetaAnalyse Portal - by MageOfFlowers</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
